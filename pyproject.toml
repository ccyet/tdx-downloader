[project]
name = "tdx-downloader"
version = "0.1.0"
description = "Standalone TDX data download and cache management web app"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "protobuf>=3.20,<6",
  "pyarrow>=15",
  "python-dateutil>=2.8",
  "pytz>=2024.1",
  "tzdata>=2024.1",
  "uvicorn>=0.29,<1",
  "watchdog>=4",
]

[project.scripts]
tdx-downloader = "tdx_downloader.cli:main"
tdx-downloader-api = "tdx_downloader.web_api:main"

[tool.setuptools.packages.find]
include = ["tdx_downloader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
