<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TDX 工作台使用指南</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efef;
      --paper: #ffffff;
      --paper-soft: #fbf6f5;
      --ink: #17202f;
      --muted: #6f6470;
      --line: #dfd2d1;
      --line-strong: #cbb7b4;
      --accent: #0b7f7a;
      --accent-deep: #075f5a;
      --accent-soft: #e9f8f6;
      --rose: #b94e48;
      --rose-deep: #7f302d;
      --rose-soft: #fff0ee;
      --warm-paper: #fffbf8;
      --blue: #2563eb;
      --green: #15803d;
      --amber: #b45309;
      --red: #c2410c;
      --shadow: 0 18px 48px rgba(15, 23, 42, 0.08);
      --radius: 8px;
      font-family: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", ui-sans-serif, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 72% 0%, rgba(185, 78, 72, 0.1), transparent 34%),
        linear-gradient(180deg, #f6eeee 0%, var(--bg) 42%, #eef5f3 100%);
      color: var(--ink);
      text-rendering: geometricPrecision;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 286px minmax(0, 1fr);
    }

    .rail {
      position: sticky;
      top: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 16px;
      border-right: 1px solid var(--line);
      background: rgba(255, 251, 248, 0.9);
      padding: 20px;
      overflow: hidden auto;
    }

    .brand {
      display: grid;
      gap: 8px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--accent-border, #8fcfca);
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--accent-deep);
      font-size: 13px;
      font-weight: 950;
      letter-spacing: 0;
    }

    .brand strong {
      font-size: 19px;
      line-height: 1.2;
    }

    .brand span,
    .rail-foot,
    .hint {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      line-height: 1.6;
    }

    .role-card {
      display: grid;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--warm-paper);
      padding: 12px;
    }

    .role-card label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }

    .role-card select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--ink);
      padding: 9px 10px;
      font-size: 13px;
      font-weight: 850;
    }

    .nav-list {
      display: grid;
      gap: 8px;
    }

    .nav-button {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      border: 1px solid transparent;
      border-left: 3px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      padding: 10px 9px 10px 12px;
      text-align: left;
    }

    .nav-button:hover {
      background: #fff9f7;
    }

    .nav-button.active {
      border-color: #d9aaa5;
      border-left-color: var(--rose);
      background: var(--rose-soft);
    }

    .nav-button strong,
    .nav-button span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-button strong {
      display: block;
      font-size: 13px;
      line-height: 1.2;
    }

    .nav-button span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }

    .nav-score {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }

    .main {
      min-width: 0;
      display: grid;
      gap: 16px;
      padding: 22px 24px 36px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 251, 248, 0.94);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.05);
      padding: 14px 16px;
      backdrop-filter: blur(16px);
    }

    .topbar h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .topbar p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      line-height: 1.5;
    }

    .view-switch {
      display: inline-flex;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f8eeee;
      padding: 4px;
    }

    .view-switch button {
      min-height: 32px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      padding: 0 10px;
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
    }

    .view-switch button.active {
      background: #ffffff;
      color: var(--rose-deep);
      box-shadow: 0 1px 5px rgba(15, 23, 42, 0.08);
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .grid.two {
      grid-template-columns: minmax(0, 1.05fr) minmax(380px, 0.95fr);
      align-items: start;
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: #fff8f6;
      padding: 13px 15px;
    }

    .panel-head strong {
      display: block;
      font-size: 14px;
      line-height: 1.25;
    }

    .panel-head span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
      line-height: 1.45;
    }

    .panel-body {
      padding: 15px;
    }

    .hero-map {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(340px, 0.8fr);
      gap: 14px;
      align-items: stretch;
    }

    .intro {
      display: grid;
      gap: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, #fffdfb 0%, #fff4f1 100%);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .intro h2 {
      margin: 0;
      max-width: 780px;
      font-size: 28px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .intro p {
      margin: 0;
      max-width: 840px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 760;
      line-height: 1.75;
    }

    .starter-path {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      align-items: stretch;
    }

    .path-step {
      min-width: 0;
      display: grid;
      grid-template-rows: 24px 42px minmax(66px, 1fr);
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.76);
      padding: 10px;
    }

    .path-step b {
      color: var(--accent-deep);
      font-size: 11px;
      font-weight: 950;
    }

    .path-step strong {
      min-width: 0;
      align-self: center;
      overflow: hidden;
      font-size: 12px;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: normal;
    }

    .path-step span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 760;
      line-height: 1.35;
    }

    .metric-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      align-items: stretch;
    }

    .metric-card {
      min-height: 112px;
      display: grid;
      grid-template-rows: 18px auto 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.78);
      padding: 12px;
    }

    .metric-card span,
    .metric-card em {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-style: normal;
      font-weight: 800;
      line-height: 1.35;
    }

    .metric-card strong {
      display: block;
      margin: 5px 0 3px;
      color: var(--ink);
      font-size: 23px;
      line-height: 1.05;
      font-weight: 950;
    }

    .workbench-detail {
      display: grid;
      gap: 14px;
    }

    .detail-title {
      display: grid;
      gap: 8px;
      border-left: 4px solid var(--rose);
      background: var(--rose-soft);
      border-radius: var(--radius);
      padding: 14px;
    }

    .detail-title h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
    }

    .detail-title p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 780;
      line-height: 1.65;
    }

    .fact-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .fact-card {
      min-height: 122px;
      display: grid;
      grid-template-rows: 18px minmax(0, 1fr);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.82);
      padding: 12px;
    }

    .fact-card span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      line-height: 1.35;
    }

    .fact-card strong {
      display: block;
      margin-top: 5px;
      font-size: 13px;
      line-height: 1.55;
    }

    .checklist,
    .subtool-list {
      display: grid;
      gap: 8px;
    }

    .check-item,
    .subtool {
      min-height: 72px;
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      padding: 10px;
    }

    .check-number {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: var(--rose-soft);
      color: var(--rose-deep);
      font-size: 11px;
      font-weight: 950;
    }

    .check-item strong,
    .subtool strong {
      display: block;
      font-size: 13px;
      line-height: 1.35;
    }

    .check-item span,
    .subtool span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
      line-height: 1.6;
    }

    .chart-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.8);
      padding: 14px;
    }

    .chart-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .chart-title strong {
      font-size: 13px;
    }

    .chart-title span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .bars {
      display: grid;
      gap: 9px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr) 42px;
      gap: 9px;
      align-items: center;
    }

    .bar-row span,
    .bar-row b {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bar-track {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #eadfdd;
    }

    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #dba09a 0%, var(--rose) 48%, var(--accent) 100%);
    }

    .matrix {
      display: grid;
      gap: 6px;
      min-width: 0;
      overflow-x: auto;
    }

    .matrix-grid {
      display: grid;
      grid-template-columns: 118px repeat(6, 72px);
      gap: 6px;
      min-width: max-content;
    }

    .matrix-cell {
      min-height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.84);
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-align: center;
    }

    .matrix-cell.head {
      background: #fff7f4;
      color: var(--ink);
    }

    .matrix-cell.fill-1 {
      background: rgba(255, 240, 238, 0.88);
      color: var(--rose-deep);
    }

    .matrix-cell.fill-2 {
      background: rgba(219, 160, 154, 0.5);
      color: var(--rose-deep);
    }

    .matrix-cell.fill-3 {
      background: linear-gradient(135deg, rgba(185, 78, 72, 0.84), rgba(11, 127, 122, 0.78));
      color: #ffffff;
    }

    .flow-chart {
      display: grid;
      gap: 9px;
    }

    .flow-node {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.84);
      padding: 10px;
    }

    .flow-node:not(:last-child)::after {
      content: "";
      width: 1px;
      height: 12px;
      margin-left: 16px;
      background: var(--line-strong);
      transform: translateY(11px);
    }

    .flow-node b {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--rose-soft);
      color: var(--rose-deep);
      font-size: 12px;
    }

    .flow-node strong {
      display: block;
      font-size: 13px;
    }

    .flow-node span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
    }

    .flow-node em {
      color: var(--muted);
      font-size: 11px;
      font-style: normal;
      font-weight: 900;
    }

    .scatter {
      position: relative;
      height: 310px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(90deg, transparent 49.5%, rgba(127, 48, 45, 0.13) 50%, transparent 50.5%),
        linear-gradient(0deg, transparent 49.5%, rgba(127, 48, 45, 0.13) 50%, transparent 50.5%),
        #ffffff;
      overflow: hidden;
    }

    .scatter-axis {
      position: absolute;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
    }

    .scatter-axis.x {
      right: 12px;
      bottom: 10px;
    }

    .scatter-axis.y {
      left: 12px;
      top: 10px;
    }

    .scatter-dot {
      position: absolute;
      transform: translate(-50%, -50%);
      display: grid;
      gap: 3px;
      place-items: center;
      border: 0;
      background: transparent;
      padding: 0;
    }

    .scatter-dot i {
      width: 13px;
      height: 13px;
      border: 2px solid #ffffff;
      border-radius: 999px;
      background: var(--rose);
      box-shadow: 0 0 0 1px rgba(185, 78, 72, 0.32);
    }

    .scatter-dot span {
      max-width: 92px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink);
      padding: 3px 6px;
      font-size: 10px;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .route-list {
      display: grid;
      gap: 10px;
    }

    .route-card {
      min-height: 92px;
      display: grid;
      gap: 9px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      padding: 12px;
    }

    .route-card strong {
      font-size: 13px;
    }

    .route-card span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 780;
      line-height: 1.55;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      border: 1px solid #cfe1df;
      border-radius: 999px;
      background: var(--rose-soft);
      color: var(--rose-deep);
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 900;
    }

    .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 22px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      padding: 0 7px;
      font-size: 11px;
      font-weight: 900;
    }

    .empty-note {
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: #fbfcfd;
      color: var(--muted);
      padding: 14px;
      font-size: 12px;
      font-weight: 760;
      line-height: 1.7;
    }

    @media (max-width: 1180px) {
      .app {
        grid-template-columns: 1fr;
      }

      .rail {
        position: static;
        height: auto;
      }

      .nav-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .hero-map,
      .grid.two,
      .grid.three {
        grid-template-columns: 1fr;
      }

      .starter-path,
      .metric-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .main {
        padding: 14px;
      }

      .topbar {
        grid-template-columns: 1fr;
      }

      .nav-list,
      .starter-path,
      .metric-strip,
      .fact-grid {
        grid-template-columns: 1fr;
      }

      .intro h2 {
        font-size: 23px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="data.jsx?v=3"></script>
  <script type="text/babel" src="charts.jsx?v=3"></script>
  <script type="text/babel" src="app.jsx?v=3"></script>
</body>
</html>
